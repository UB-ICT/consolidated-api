services:
    laravel.test:
        platform: linux/amd64
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: sail-8.2/app
        container_name: api-web
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            # - '${APP_PORT:-80}:80'
            - "3031:80" # Map port 8000 on your host to port 80 in the container
            #- "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
            - "./storage/app/google:/var/www/html/storage/app/google"
            # - "./docker-config/php.ini:/etc/php/8.2/cli/php.ini"
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    pgsql:
        image: "postgres:15"
        container_name: api-db
        ports:
            # - "${DB_PORT:-5432}:5432"
            - "5432:5432"
        environment:
            # Must be non-empty for official postgres image. Defaults match typical Sail local .env.
            # If you still see "superuser password is not specified", set DB_PASSWORD in consolidated-api/.env
            # and run `docker compose` from this directory (or pass --env-file).
            POSTGRES_DB: "${POSTGRES_DATABASE:-ub}"
            POSTGRES_USER: "${POSTGRES_USERNAME:-postgres}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
        volumes:
            - "sail-pgsql:/var/lib/postgresql/data"
            - "./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - "-q"
                - "-d"
                - "${POSTGRES_DATABASE:-ub}"
                - "-U"
                - "${POSTGRES_USERNAME:-postgres}"
            retries: 3
            timeout: 5s
    redis:
        image: "redis:alpine"
        container_name: api-cache
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
