services:
    laravel.test:
        platform: linux/amd64
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: sail-8.2/app
        container_name: consolidated-api-web

        extra_hosts:
            - "host.docker.internal:host-gateway"

        ports:
            - "3031:80"

        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"

        volumes:
            - ".:/var/www/html"
            - "./storage/app/google:/var/www/html/storage/app/google"

        networks:
            - sail

        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    pgsql:
        image: postgres:15
        container_name: consolidated-api-db

        ports:
            - "5432:5432"

        environment:
            POSTGRES_DB: "${PGSQL_DATABASE:-ub}"
            POSTGRES_USER: "${PGSQL_USERNAME:-postgres}"
            POSTGRES_PASSWORD: "${PGSQL_PASSWORD:-password}"

        volumes:
            - sail-pgsql:/var/lib/postgresql/data
            - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql

        networks:
            sail:
                aliases:
                    - api-db

        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${PGSQL_USERNAME:-postgres}", "-d", "${PGSQL_DATABASE:-ub}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:alpine
        container_name: consolidated-api-cache

        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"

        volumes:
            - sail-redis:/data

        networks:
            - sail

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local